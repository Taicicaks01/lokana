; Lokana OS — firmware Lokana (ESP32-C3 Super Mini + OLED 0.96" 128x64)
; env:supermini     -> hardware asli  (OLED 128x64, I2C SDA 9 / SCL 8, sentuh TTP223 GPIO3)
; env:supermini-091 -> hardware asli varian OLED 0.91" 128x32 (tata letak ringkas)
; env:wokwi         -> simulasi Wokwi (diagram.json masih SDA 8 / SCL 9, tombol mekanis ke GND = aktif LOW)
;
; Upload ke board asli: pilih env "supermini" (status bar / Project Tasks), bukan Upload default.
; Partisi: partitions.csv (2 slot OTA 1,75 MB + littlefs + coredump), lihat docs/ARCHITECTURE.md §2.6.

[platformio]
default_envs = supermini

[env]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.11
  h2zero/NimBLE-Arduino@~1.4.3
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:wokwi]
build_flags =
  ${env.build_flags}
  -DWOKWI_SIM=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DPIN_SDA=8
  -DPIN_SCL=9
  -DPIN_BTN=3
  -DBTN_ACTIVE_LOW=1
  -DPIN_LED=-1
  -DPIN_BATT=1

[env:supermini]
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 921600
; Pakai tombol mekanis ke GND (bukan TTP223)? tambahkan: -DBTN_ACTIVE_LOW=1

; Uji rollback OTA: firmware yang SENGAJA crash di setup(). Kirim lewat OTA (bukan upload USB!):
;   pio run -e supermini-otacrash  ->  python protocol/tools/lokana_link.py ota .pio/build/supermini-otacrash/firmware.bin
; Lokana harus kembali ke versi lama sendiri. Jangan dipakai untuk upload biasa.
[env:supermini-otacrash]
extends = env:supermini
build_flags =
  ${env:supermini.build_flags}
  -DLOKANA_OTA_TEST_CRASH=1
  '-DFW_VERSION="0.5.5-rusak"'

[env:supermini-091]
extends = env:supermini
build_flags =
  ${env:supermini.build_flags}
  -DSCREEN_H=32
